- aid: lbank:websocket-account-order-api
  name: LBank WebSocket Account and Order API
  description: >-
    Authenticated WebSocket API for receiving real-time account balance and order status updates from
    LBank. Clients can subscribe to asset balance change notifications and live order execution updates
    including partial fills, full fills, and cancellations. Authentication uses signed subscription requests.
    Suitable for trading bots and portfolio management applications that need immediate notification of
    order state changes without polling the REST API.
  humanURL: https://www.lbank.com/en-US/docs/
  baseURL: wss://www.lbkex.net

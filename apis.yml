apis:
- aid: lbank:websocket-market-api
  name: LBank WebSocket Market Data API
  description: >-
    Real-time WebSocket API for streaming live market data from LBank. Clients can subscribe to K-line
    (candlestick) data across multiple timeframes (1-minute to monthly), order book depth updates at configurable
    levels (10, 50, or 100 price levels), recent trade streams, and full market ticker updates. The connection
    uses ping/pong heartbeat to maintain session liveness. Recommended for trading applications requiring
    low-latency market data without REST polling.
  humanURL: https://www.lbank.com/en-US/docs/
  baseURL: wss://www.lbkex.net
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
